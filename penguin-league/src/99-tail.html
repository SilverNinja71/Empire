</script>
<script>
  // shows a readable message if the game module fails to load (e.g. no WebGL or CDN blocked)
  window.addEventListener('error', function (e) {
    var ld = document.getElementById('loading');
    if (!ld || ld.hidden) return;
    ld.classList.add('err');
    var m = document.getElementById('loading-msg');
    if (m) m.textContent = 'Penguin League could not start: ' + (e.message || 'unknown error') + '. It needs WebGL and access to cdn.jsdelivr.net.';
  });
</script>
