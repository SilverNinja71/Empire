name: Hub Checks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Shared Accounts Syntax Check
        # Every game loads this file from ../Empire/shared/accounts.js
        run: node --check shared/accounts.js
