name: Build Verification CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Build Script
        run: python3 mace-pvp/build.py

      - name: Verify Generated Files Exist
        run: |
          test -f mace-pvp/bundle.js || exit 1
          test -f mace-pvp/spear-mace-pvp.html
          test -f penguin-life/index.html || exit 1 || exit 1
          echo "All builds verified successfully!"
